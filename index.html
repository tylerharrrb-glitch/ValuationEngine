<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230A0E17'/%3E%3Ctext x='32' y='40' font-family='serif' font-weight='900' font-size='18' fill='%23C9A84C' text-anchor='middle'%3EWOLF%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WOLF Valuation Engine - Institutional-grade equity valuation with DCF, Monte Carlo simulation, and Comparable Company Analysis" />
    <meta name="keywords" content="valuation, DCF, financial analysis, stock valuation, investment, finance, equity research" />
    <meta name="author" content="Ahmed Wael Metwally" />
    <meta name="theme-color" content="#080b11" />
    <title>WOLF | Valuation Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Apply persisted theme before paint to avoid a flash of the wrong theme. Default: dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wolf-theme');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <style>
      body {
        background-color: #080b11;
        overflow-x: hidden;
      }
      html[data-theme="light"] body { background-color: #ece5d6; }
      /* Loading state */
      .wolf-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #080b11 0%, #0e121b 100%);
      }
      html[data-theme="light"] .wolf-loading {
        background: linear-gradient(135deg, #ece5d6 0%, #f1ebdd 100%);
      }
      .wolf-loading-text {
        font-family: 'Spectral', Georgia, serif;
        font-weight: 700;
        font-size: 2.5rem;
        letter-spacing: .15em;
        color: #c9a961;
        animation: wolfPulse 2s ease-in-out infinite;
      }
      @keyframes wolfPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="wolf-loading">
        <span class="wolf-loading-text">WOLF</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
